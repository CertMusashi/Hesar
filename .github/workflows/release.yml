name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Version code (integer, e.g., 1)'
        required: true
        default: '1'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.5'
        channel: 'stable'

    - name: Determine version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${{ github.event.inputs.version_code }}" >> $GITHUB_OUTPUT
        else
          # Extract version from tag (e.g., v1.0.0 -> 1.0.0)
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          # Generate version code from tag (e.g., 1.0.0 -> 100)
          VERSION_CODE=$(echo $VERSION | awk -F. '{print $1*100 + $2*10 + $3}')
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_OUTPUT
        fi

    - name: Update version in pubspec.yaml
      run: |
        sed -i "s/^version: .*/version: ${{ steps.version.outputs.VERSION }}+${{ steps.version.outputs.VERSION_CODE }}/" pubspec.yaml

    - name: Install dependencies
      run: flutter pub get

    - name: Run Flutter analyzer
      run: flutter analyze --no-fatal-infos

    - name: Build APK (split-per-abi)
      run: flutter build apk --release --split-per-abi

    - name: Rename APK files
      run: |
        cd build/app/outputs/flutter-apk
        mv app-armeabi-v7a-release.apk hesar-${{ steps.version.outputs.VERSION }}-armeabi-v7a.apk
        mv app-arm64-v8a-release.apk hesar-${{ steps.version.outputs.VERSION }}-arm64-v8a.apk
        mv app-x86_64-release.apk hesar-${{ steps.version.outputs.VERSION }}-x86_64.apk
        mv app-x86-release.apk hesar-${{ steps.version.outputs.VERSION }}-x86.apk
        # Check if universal APK exists (only if universalApk is true in build.gradle)
        if [ -f "app-release.apk" ]; then
          mv app-release.apk hesar-${{ steps.version.outputs.VERSION }}-universal.apk
          echo "UNIVERSAL_APK_EXISTS=true" >> $GITHUB_ENV
        else
          echo "UNIVERSAL_APK_EXISTS=false" >> $GITHUB_ENV
        fi

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
        name: Release ${{ steps.version.outputs.VERSION }}
        body: |
          ## دانلود نسخه ${{ steps.version.outputs.VERSION }}
          
          ### معماری‌های موجود:
          - **arm64-v8a**: دستگاه‌های مدرن 64-بیتی (توصیه می‌شود)
          - **armeabi-v7a**: دستگاه‌های قدیمی‌تر 32-بیتی
          - **x86_64**: شبیه‌سازها و دستگاه‌های x86 64-بیتی
          - **x86**: شبیه‌سازها و دستگاه‌های x86 32-بیتی
          - **universal**: سازگار با همه معماری‌ها (حجم بیشتر)
          
          ### تغییرات:
          - بهبود امنیت با استفاده از رمزنگاری AES-256-GCM
          - کاهش حجم APK با ساخت جداگانه برای هر معماری
          - بهبود عملکرد و رفع اشکالات
          
          ---
          
          ## Download Version ${{ steps.version.outputs.VERSION }}
          
          ### Available Architectures:
          - **arm64-v8a**: Modern 64-bit devices (recommended)
          - **armeabi-v7a**: Older 32-bit devices
          - **x86_64**: x86 64-bit emulators and devices
          - **x86**: x86 32-bit emulators and devices
          - **universal**: Compatible with all architectures (larger size)
          
          ### Changes:
          - Improved security with AES-256-GCM encryption
          - Reduced APK size with split builds per architecture
          - Performance improvements and bug fixes
        draft: false
        prerelease: false
        files: |
          build/app/outputs/flutter-apk/hesar-${{ steps.version.outputs.VERSION }}-armeabi-v7a.apk
          build/app/outputs/flutter-apk/hesar-${{ steps.version.outputs.VERSION }}-arm64-v8a.apk
          build/app/outputs/flutter-apk/hesar-${{ steps.version.outputs.VERSION }}-x86_64.apk
          build/app/outputs/flutter-apk/hesar-${{ steps.version.outputs.VERSION }}-x86.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload universal APK to Release (if exists)
      if: env.UNIVERSAL_APK_EXISTS == 'true'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
        files: |
          build/app/outputs/flutter-apk/hesar-${{ steps.version.outputs.VERSION }}-universal.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK artifacts
      uses: actions/upload-artifact@v4
      with:
        name: release-apks
        path: |
          build/app/outputs/flutter-apk/hesar-${{ steps.version.outputs.VERSION }}-*.apk
        retention-days: 90
